<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Forum&family=Playwrite+BE+WAL+Guides&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap');

        .forum-regular {
            font-family: "Forum", serif;
            font-weight: 400;
            font-style: normal;
        }


        * {
            margin: 0;
            box-sizing: border-box;
            font-family: "Ubuntu", sans-serif;
            font-weight: 500;
        }

        .main {
            background-image: url(bgih3.jpeg);
            width: 100%;
            height: 100vh;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card {
            padding: 25px;
            display: flex;
            flex-direction: column;
            background-color: rgba(255, 255, 255, 0.500);
            width: 400px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            margin-top: 55px;
            font-size: 50px;
            margin-bottom: 55px;
        }

        .text {
            margin-top: 15px;
            border: none;
            background-color: rgba(255, 255, 255, 0.525);
            outline: none;
            border-radius: 10px;
            height: 60px;
        }

        button {
            margin-top: 55px;
            background-color: darkslategrey;
            border: none;
            outline: none;
            padding: 15px 100px;
            margin-bottom: 30px;
        }

        #checkbox_div {
            display: flex;
        }
        .form-options{
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="card">
            <h1>Account Login</h1>
            <input class="text" type="text" placeholder="User Name">
            <input class='text' type="password" placeholder="Password">
            <button>Login</button>
            <div class="form-options">
                <div id="checkbox-container">
                    <input type="checkbox" name="remember_me" id="remember_me">
                    <label for="remember_me">remember me</label>
                </div>
                <a href="#">Forgot Password?</a>
            </div>
        </div>
    </div>
</body>

</html>
